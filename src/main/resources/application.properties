spring.application.name=hobbyconnect
server.port=8080

# ============================================================
# MySQL / MariaDB Database (XAMPP)
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/hobbyconnect_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ============================================================
# Thymeleaf
# ============================================================
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ============================================================
# Session
# ============================================================
server.servlet.session.timeout=60m
