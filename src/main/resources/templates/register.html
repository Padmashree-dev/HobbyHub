<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account – HobbyConnect</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-page">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <!-- Registration Card -->
                <div class="card-custom p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
                            <i class="bi bi-person-plus-fill"></i>
                        </div>
                        <h2 class="fw-bold mb-1">Join <span class="text-gradient">HobbyConnect</span></h2>
                        <p class="text-secondary small">Create your account to start meeting people with common interests.</p>
                    </div>

                    <!-- Error Alert -->
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${error}">Error message</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/register}" method="POST">
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold small text-secondary">Full Name *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control form-control-custom border-start-0" id="fullName" name="fullName"
                                       th:value="${fullName}" placeholder="e.g. John Doe" required autofocus>
                            </div>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label for="username" class="form-label fw-semibold small text-secondary">Username *</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted">@</span>
                                    <input type="text" class="form-control form-control-custom border-start-0" id="username" name="username"
                                           th:value="${username}" placeholder="johndoe" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="location" class="form-label fw-semibold small text-secondary">City / Location</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-geo-alt"></i></span>
                                    <input type="text" class="form-control form-control-custom border-start-0" id="location" name="location"
                                           th:value="${location}" placeholder="e.g. New York, NY">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold small text-secondary">Email Address *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control form-control-custom border-start-0" id="email" name="email"
                                       th:value="${email}" placeholder="john@example.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold small text-secondary">Password (Min. 6 chars) *</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control form-control-custom border-start-0" id="password" name="password"
                                       placeholder="••••••••" minlength="6" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="bio" class="form-label fw-semibold small text-secondary">About Me / Bio</label>
                            <textarea class="form-control form-control-custom" id="bio" name="bio" rows="2"
                                      placeholder="Tell other hobbyists about yourself, projects, and what you enjoy..." th:text="${bio}"></textarea>
                        </div>

                        <!-- Avatar Style Choice -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold small text-secondary">Choose an Avatar Color</label>
                            <div class="d-flex gap-3 justify-content-center">
                                <label class="avatar-option cursor-pointer">
                                    <input type="radio" name="avatar" value="avatar-1" class="d-none" checked>
                                    <div class="avatar-circle avatar-lg shadow-sm" style="background: linear-gradient(135deg, #7209b7 0%, #f72585 100%);">
                                        🎨
                                    </div>
                                </label>
                                <label class="avatar-option cursor-pointer">
                                    <input type="radio" name="avatar" value="avatar-2" class="d-none">
                                    <div class="avatar-circle avatar-lg shadow-sm" style="background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);">
                                        💻
                                    </div>
                                </label>
                                <label class="avatar-option cursor-pointer">
                                    <input type="radio" name="avatar" value="avatar-3" class="d-none">
                                    <div class="avatar-circle avatar-lg shadow-sm" style="background: linear-gradient(135deg, #f72585 0%, #ff70a6 100%);">
                                        🎵
                                    </div>
                                </label>
                                <label class="avatar-option cursor-pointer">
                                    <input type="radio" name="avatar" value="avatar-4" class="d-none">
                                    <div class="avatar-circle avatar-lg shadow-sm" style="background: linear-gradient(135deg, #06d6a0 0%, #118ab2 100%);">
                                        ⚡
                                    </div>
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-brand w-100 py-3 mb-3">
                            <i class="bi bi-person-check-fill"></i> Register & Select Hobbies
                        </button>

                        <div class="text-center">
                            <span class="text-secondary small">Already have an account? </span>
                            <a th:href="@{/login}" class="text-purple fw-semibold small text-decoration-none">Log in here</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
