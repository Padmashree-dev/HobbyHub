<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile – HobbyConnect</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-page">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="py-5">
    <div class="container">
        <!-- Back link -->
        <div class="mb-4 col-md-8 col-lg-6 mx-auto">
            <a th:href="@{/profile}" class="text-secondary text-decoration-none small">
                <i class="bi bi-arrow-left"></i> Back to Profile
            </a>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card-custom p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
                            <i class="bi bi-pencil-square"></i>
                        </div>
                        <h2 class="fw-bold mb-1">Update <span class="text-gradient">Profile</span></h2>
                        <p class="text-secondary small">Keep your profile fresh so other hobbyists get to know you better.</p>
                    </div>

                    <!-- Alerts -->
                    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show rounded-3" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${errorMessage}">Error message</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/profile/edit}" method="POST">
                        <div class="mb-3">
                            <label for="fullName" class="form-label fw-semibold small text-secondary">Full Name *</label>
                            <input type="text" class="form-control form-control-custom" id="fullName" name="fullName"
                                   th:value="${currentUser.fullName}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">Username (Read-only)</label>
                            <input type="text" class="form-control form-control-custom bg-light"
                                   th:value="'@' + ${currentUser.username}" readonly disabled>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">Email (Read-only)</label>
                            <input type="email" class="form-control form-control-custom bg-light"
                                   th:value="${currentUser.email}" readonly disabled>
                        </div>

                        <div class="mb-3">
                            <label for="location" class="form-label fw-semibold small text-secondary">City / Location</label>
                            <input type="text" class="form-control form-control-custom" id="location" name="location"
                                   th:value="${currentUser.location}" placeholder="e.g. Seattle, WA">
                        </div>

                        <div class="mb-4">
                            <label for="bio" class="form-label fw-semibold small text-secondary">About Me / Bio</label>
                            <textarea class="form-control form-control-custom" id="bio" name="bio" rows="4"
                                      placeholder="Share what projects you love, what games you play, or your favorite musical artists..."
                                      th:text="${currentUser.bio}"></textarea>
                        </div>

                        <div class="d-flex gap-2">
                            <a th:href="@{/profile}" class="btn btn-outline-secondary rounded-pill px-4 flex-fill">Cancel</a>
                            <button type="submit" class="btn btn-brand px-4 flex-fill">
                                <i class="bi bi-check2-circle"></i> Save Changes
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
