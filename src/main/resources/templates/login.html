<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In – HobbyConnect</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-page">

<!-- Navbar -->
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card-custom p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="brand-icon mx-auto mb-3" style="width: 50px; height: 50px; font-size: 1.5rem;">
                            <i class="bi bi-box-arrow-in-right"></i>
                        </div>
                        <h2 class="fw-bold mb-1">Welcome <span class="text-gradient">Back</span></h2>
                        <p class="text-secondary small">Log in to view your hobby matches, messages, and communities.</p>
                    </div>

                    <!-- Alerts -->
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${error}">Error message</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <div th:if="${info}" class="alert alert-info alert-dismissible fade show rounded-3" role="alert">
                        <i class="bi bi-info-circle-fill me-2"></i>
                        <span th:text="${info}">Info message</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <form th:action="@{/login}" method="POST">
                        <div class="mb-3">
                            <label for="usernameOrEmail" class="form-label fw-semibold small text-secondary">Username or Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control form-control-custom border-start-0" id="usernameOrEmail" name="usernameOrEmail"
                                       th:value="${usernameOrEmail}" placeholder="e.g. alexr or alex@hobbyconnect.com" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold small text-secondary">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control form-control-custom border-start-0" id="password" name="password"
                                       placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-brand w-100 py-3 mb-3">
                            <i class="bi bi-box-arrow-in-right"></i> Log In
                        </button>

                        <div class="text-center">
                            <span class="text-secondary small">Don't have an account yet? </span>
                            <a th:href="@{/register}" class="text-purple fw-semibold small text-decoration-none">Sign up here</a>
                        </div>
                    </form>

                    <!-- Quick Demo Credentials Box for Convenience -->
                    <div class="mt-4 p-3 bg-light rounded-3 border text-center small text-secondary">
                        <span class="fw-bold text-dark d-block mb-1"><i class="bi bi-key-fill text-pink me-1"></i> Quick Demo Accounts</span>
                        <span>Username: <code>alexr</code> | Password: <code>password123</code></span><br>
                        <span>Username: <code>mayac</code> | Password: <code>password123</code></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
